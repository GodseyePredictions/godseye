# Every threshold, weight and cap for the NHL engine. Nothing else in nhl/ hard-codes one.
# Phase 1 (ingest and derived tables) settings only; later phases add their own blocks.

seasons:
  history: [2023, 2024, 2025]     # three full seasons of play-by-play (season = the year it starts)
  current: 2026
  game_types: [2]                 # 2 = regular season
result_known_after_hours: 4       # a game's stats count as known this long after puck drop

sources:
  min_interval:                   # seconds between requests, per host
    api-web.nhle.com: 0.15
    api.nhle.com: 0.2
    moneypuck.com: 1.0
    peter-tanner.com: 1.0
    www.naturalstattrick.com: 3.0
    www.dailyfaceoff.com: 1.0
    scoutingtherefs.com: 2.0
    api.the-odds-api.com: 1.0
  retries: 4
  schedule_max_age_sec: 21600     # current-season schedule is re-read after 6 hours
  live_week_max_age_sec: 600      # the current week of the schedule (game states) is re-read after 10 minutes
  partner_country: CA             # the NHL's partner book differs by country: CA is FanDuel, US is DraftKings (owner, 24 November: not DraftKings)
  recent_game_max_age_sec: 3600   # games from the last two days may still be corrected by the league
  empty_shifts_retry_sec: 86400   # a game whose shift chart came back empty is asked for again after a day
  moneypuck_max_age_sec: 43200    # current-season shot file is rebuilt nightly
  gameday_max_age_sec: 1500       # Daily Faceoff and referee pages: re-read every 30 minutes until confirmed
  refresh_lead_min: 90            # the game-day refresh runs this long before puck drop
  odds_api_key_env: ODDS_API_KEY
  odds_regions: us,uk,eu,au
  odds_books: [bet365]
  goalie_confirmed_labels: [Confirmed]

strength:
  min_state_run_sec: 4            # a power-play or penalty-kill stretch shorter than this is line-change noise
  shift_quality_min: 0.95         # share of seconds with 3 to 6 skaters a side for a shift chart to be trusted
  high_danger_xg: 0.20            # MoneyPuck's cut for a high-danger shot

rates:
  team_weight_season: 0.60        # spec: season 60% / last 10 games 40%
  team_weight_recent: 0.40
  recent_games: 10
  season_carry_games: 20          # early in a season, last season stands in for this many games of sample
  prior_season_weight: 0.5        # last season's games count this much in a player's or goalie's season sample
  player_prior_toi_min:           # shrink a player's per-60 rate toward his position's league rate; strength in minutes
    ev: 300
    pp: 60
    pk: 60
  player_prior_scale: {hits: 0.3, blocks: 0.5}   # hits and blocks settle quickly: a smaller prior than scoring stats (backtest: high-hit legs ran 8 points under)
  player_weight_recent: 0.30      # recent form (last 10) is shrunk toward the season rate
  finishing_prior_xg: 60          # goals above expected are shrunk hard: this many expected goals of league-average finishing
  goalie_min_starts: 15           # GSAx is shrunk toward league average; below this many starts it is all prior
  goalie_prior_shots: 1200        # unblocked shots of league-average goaltending mixed into every goalie

toi:
  recent_games: 10
  weight_recent: 0.65             # last 10 games, shrunk toward the season
  prior_games: 6                  # with fewer recent games than this the season carries more
  pp1_share: 0.62                 # PP1 gets about 60 to 65% of the team's power-play time
  pp2_share: 0.38
  line_slot_weight: 0.5           # share of the gap between tonight's slot's usual minutes and his usual slot's that is applied
  pp_surplus_kept: 0.5            # a unit member already above the unit's share keeps this much of the surplus
  pp_off_unit_factor: 0.2         # share of his usual power-play time kept by a player on neither unit tonight
  lines_max_age_hours: 30         # Daily Faceoff lines older than this are not used

schedule:
  b2b_days: 1
  three_in_four_days: 4
  earth_radius_km: 6371.0

arena_bias:
  seasons: 3
  stats: [hits, blocks, sog]
  prior_games: 60                 # shrink toward 1.00: this many games of "no bias"
  cap: 0.25                       # factor is held within 1 +/- cap

refs:
  prior_games: 40                 # a referee's penalty rate is shrunk toward the league with this many games
  factor_cap: 0.15

spotcheck:
  team_xg_tolerance: 0.03         # our team xG vs MoneyPuck's season file, relative
  player_toi_tolerance: 0.03      # our TOI by strength vs the league's own, relative
  player_toi_abs_min: 1.0         # ... or within this many minutes over the season, whichever is looser

# ------------------------------------------------------------------ Phase 2: gates and game sim
gates:
  goalie_statuses: [Confirmed]    # Daily Faceoff labels that pass the goalie gate
  lines_max_age_hours: 30         # line combinations and PP units older than this are not "game-day"
  key_linemates: 2                # a player's line-mates this deep must also pass the injury check
  preview: false                  # true (or `slate --preview`): goalie and lines gates are noted, not enforced, and nothing is written to the ledger
  issue_early: false              # with preview (or `slate --early`): the early card is logged and graded, and re-issued game by game as gates pass
  early_fallback: true            # a gated run re-issues a game that has not passed its goalie and lines gates as an early slip on the latest personnel
  require_book_rung: false        # true: a leg with no listed rung is removed (the spec's gate 4). false: paper mode, see tickets.paper_ladders

sim:
  n_sims: 20000
  n_sims_backtest: 2000
  seed: 20261124
  halves_per_period: 2            # the score state is re-read this many times a period
  team_sd: 0.0                    # gamma spread of a team's scoring from game to game (negative binomial). Fitted: 4,320 games show
  pace_sd: 0.0                    #   goals slightly under-dispersed (variance/mean 0.97), so the mixing is kept close to Poisson
  shot_sd: 0.18                   # game-to-game spread of a team's shot volume beyond Poisson (backtest: saves legs ran over-confident without it)
  goal_scale: 1.03                # backtest over 4,093 games: simulated scoring ran 3% under actual
  season_goal_prior_xg: 600       # this season's goals-per-xG is shrunk toward 1.00 by this many expected goals
  tied_late_factor: 0.6           # scoring in a tied game's last ten minutes; tuned so the sim's overtime rate matches the league's
  en_window_sec: 180              # the trailing team pulls its goalie with about 3 minutes left (tuned to the league's empty-net goals)
  en_step_sec: 30
  en_max_deficit: 2               # ... when down 1 or 2
  extra_attacker_g60: 5.5         # the trailing side's scoring rate with six skaters
  extra_attacker_sog60: 45.0
  ot_sog_per_team: 1.7
  so_home_win: 0.5
  ot_strength_weight: 0.5         # how much of the two teams' scoring ratio carries into overtime
  b2b_goals_for: 0.97             # second night of a back-to-back
  b2b_goals_against: 1.03
  rest_diff_per_day: 0.005        # per day of rest advantage, capped at 2 days
  tz_per_hour: 0.004              # per hour of time zone crossed since the last game, capped at 3
  injury_loss: 0.35               # share of an absent regular's expected goals the next man up does not replace
  injury_recent_games: 10         # an absence already covered by the team's recent games is not removed twice
  blowout_margin: 3               # lead after two periods that counts as a blowout
  blowout_flag_prob: 0.22
  edge_tiers:                     # model probability minus no-vig implied probability
    lean: 0.02
    play: 0.04
    strong: 0.07

# ------------------------------------------------------------------ Phase 3: player props
props:
  dispersion:                     # gamma spread on a player's own rate (0 = Poisson)
    sog: 0.08
    hits: 0.15
    blk: 0.22
  linemate_boost: 4.0             # weight on the scorer's line-mates when assists are handed out
  team_reconcile: 0.5             # how far player shot projections are scaled toward the team's simulated total
  blowout_top_line_trim: 0.06     # top-line ice time lost when leading by the blowout margin after two periods
  trailing_top_line_boost: 0.03   # top-line ice time gained when trailing after two periods
  top_line_forwards: 3
  top_pair_defence: 2
  pull_deficit: 3                 # a starter this far behind after two periods may be pulled
  pull_prob: 0.45
  min_toi_sec: 420                # skaters projected under this are not priced
  dress_recent_team_games: 3      # without game-day lines, a skater counts as dressed if he played in one of these

# ------------------------------------------------------------------ Phase 4: correlation and tickets
tickets:
  floor_prob: 0.70                # slip legs are floor rungs at 70%+
  floor_prob_by_market: {saves: 0.85}   # backtest: saves legs the model called 85-90% hit about 82%; skater markets hit at or above their call
  sub65_prob: 0.65
  max_sub65_legs: 1
  sizes: [4, 6, 8]                # owner, 24 November 2026: 4-, 6- and 8-leg slips, props and game lines on one slip
  max_legs_per_player: 1
  max_legs_same_line_points: 2
  max_legs_same_script: 3
  max_legs_per_market: {saves: 1, hits: 2, blk: 2, sog: 3, pts: 3, ast: 2, goals: 2}   # keeps a slip from being one market over and over
  max_legs_per_market_by_size: {4: {sog: 2, pts: 2}, 8: {hits: 3, blk: 3}}
  max_game_line_legs: 2           # at most one side (moneyline or puck line) and one total
  sgp_candidate_pool: 18
  sgp_candidate_pool_by_size: {8: 16}
  ticket_min_joint: {4: 0.25, 6: 0.12, 8: 0.06}
  combo_component_ev_gain: 0.0
  saves_cap_blowout: true         # no saves leg on the goalie facing the favourite when the blowout flag is up
  atg_legs: 2
  atg_min_prob: 0.30
  single_min_ev: 0.03
  single_min_prob: 0.0
  kelly_fraction: 0.25
  kelly_cap: 0.03
  closer_min_prob: 0.70          # the closer is the listed moneyline or puck line the model rates most likely, at 70%+ (odds never pick it)
  closer_markets: [ml, spread]    # totals are left out: in backtest the model's totals did not beat the base rate
  paper_ladders:                  # used only when no book ladder is in hand; legs are marked "rung not verified"
    sog: [2, 3, 4, 5]
    pts: [1, 2]
    ast: [1, 2]
    hits: [1, 2, 3, 4, 5]
    blk: [1, 2, 3, 4]
    saves: [20, 25, 30, 35]
  paper_game_lines:               # game lines tried when the book's own line is not in hand, or beside it
    spread: [-1.5, 1.5, 2.5]
    total: [4.5, 5.5, 6.5, 7.5]
  multi:                          # owner, 24 November 2026: one 2-game slip, one 3-game slip, one lotto ticket
    games: [2, 3]
    legs_per_game: 3
    lotto_min_decimal: 51.0       # +5000 or longer, at the model's fair price
    lotto_max_decimal: 151.0      # ... and not so long it is a throwaway
    lotto_leg_prob: [0.33, 0.60]  # each lotto leg's own chance: real longshot rungs, not floor rungs
    lotto_markets: [goals, pts, ast, sog, ml]
    lotto_max_legs_per_game: 2
    lotto_min_games: 3
    lotto_legs: [6, 10]

grading:
  saves_include_ot: true
